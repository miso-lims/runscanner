name: CI
on: [push, pull_request]
jobs:
  CI:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ matrix.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ matrix.os }}-m2
      - name: Install Dependencies
        run: |
          sudo apt-get update \
          && sudo apt-get install pkg-config cmake libjsoncpp-dev autoconf \
          libtool build-essential clang
      - name: Build Illumina Interop
        run: |
          pushd runscanner-illumina \
          && git submodule init \
          && git submodule update \
          && ./build-illumina-interop \
          && autoreconf -i \
          && ./configure \
          && make \
          && popd
      - name: Run tests
        run: |
          PATH=$PATH:$(pwd)/runscanner-illumina mvn --batch-mode clean test \
          -DskipIllumina=false
